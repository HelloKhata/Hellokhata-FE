name: Deploy Next.js via PM2

on:
  push:
    branches: ["main"] # or "dev"

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            # 1. Load PATH (ensures node, npm, and pm2 are accessible in non-interactive SSH)
            export PATH=$PATH:/usr/bin:/usr/local/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            # 2. Go to frontend directory
            cd /var/www/Hellokhata-FE || exit 1

            # 3. Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # 4. Install dependencies and build
            npm ci
            npm run build

            # 5. Reload app with 
            pm2 reload hello-khata-frontend || pm2 start npm --name "hello-khata-frontend" -- start -- -p 8200
            pm2 save
